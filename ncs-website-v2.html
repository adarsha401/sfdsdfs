<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>National Cleaning Service & Suppliers Pvt. Ltd.</title>
<meta name="description" content="National Cleaning Service & Suppliers Pvt. Ltd. (NCS): cleaning services and cleaning supplies in Kathmandu, Nepal.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;1,9..144,500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--blue:#1668e3;--blue-deep:#0d4bb0;--maroon:#6b0f14;--paper:#fff;--tint:#eaf2ff;--ink:#0f172a;--muted:#475467;--line:#d7e3f8;--on-blue:#fff;
--serif:"Fraunces",Georgia,"Times New Roman",serif;--sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;box-sizing:border-box}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--blue:#5b9bff;--blue-deep:#7fb0ff;--maroon:#e58a90;--paper:#0b1220;--tint:#111c33;--ink:#eef3fc;--muted:#a8b5cc;--line:#22314f;--on-blue:#06122b}}
:root[data-theme="dark"]{--blue:#5b9bff;--blue-deep:#7fb0ff;--maroon:#e58a90;--paper:#0b1220;--tint:#111c33;--ink:#eef3fc;--muted:#a8b5cc;--line:#22314f;--on-blue:#06122b}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:80px;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.6 var(--sans)}
img,svg,iframe{max-width:100%}a{color:inherit}p{margin:0}main:focus{outline:none}
.wrap{width:min(1120px,100% - 40px);margin-inline:auto}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:4px}
h1,h2,h3{font-family:var(--serif);line-height:1.12;margin:0}
h1{font-size:clamp(2.4rem,6.5vw,4.6rem);font-weight:800;letter-spacing:-.025em}
h2{font-size:clamp(1.8rem,4vw,2.6rem);font-weight:800;letter-spacing:-.01em}h3{font-size:1.2rem;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:46px;padding:.7rem 1.4rem;border-radius:999px;border:2px solid var(--blue);background:var(--blue);color:var(--on-blue);font:600 1rem var(--sans);text-decoration:none;cursor:pointer}
.btn:hover{background:var(--blue-deep);border-color:var(--blue-deep)}.btn.ghost{background:transparent;color:var(--blue)}.btn.ghost:hover{background:var(--tint)}
.topbar{background:#6b0f14;color:#fff;font-size:.9rem}.topbar .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 20px;padding:8px 0}.topbar a{color:#fff;text-decoration:none}.topbar .r{display:flex;flex-wrap:wrap;gap:4px 18px}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;height:68px}
.brand{display:flex;align-items:baseline;gap:.6rem;text-decoration:none}.mark{font:800 1.9rem/1 var(--serif);letter-spacing:-.02em}.mark b{color:var(--maroon);font-style:italic}.mark span{color:var(--blue)}
.brand small{font:italic 500 .95rem var(--serif);color:var(--maroon);display:none}@media(min-width:1000px){.brand small{display:block}}
nav ul{display:flex;gap:1.5rem;list-style:none;margin:0;padding:0}nav a{text-decoration:none;font-weight:500;color:var(--muted)}nav a:hover,nav a[aria-current]{color:var(--blue)}
.has-sub{position:relative}.sub{display:none;position:absolute;left:-12px;top:100%;min-width:250px;background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:8px;flex-direction:column;gap:0}
.has-sub:hover>.sub,.has-sub:focus-within>.sub{display:flex}.sub a{display:block;padding:.45rem .7rem;border-radius:8px}.sub a:hover{background:var(--tint)}
.menu{display:none;background:none;border:2px solid var(--line);border-radius:10px;width:46px;height:46px;color:var(--ink);font-size:1.2rem;cursor:pointer}
@media(max-width:860px){.menu{display:block}nav{position:absolute;left:0;right:0;top:68px;background:var(--paper);border-bottom:1px solid var(--line);display:none;padding:10px 20px 18px}nav.open{display:block}nav ul{flex-direction:column;gap:0}nav a{display:block;padding:.7rem 0}.sub{display:none!important}}
.hero{position:relative;overflow:hidden;padding:60px 0 76px}.hero::before{content:"";position:absolute;left:-18vw;top:-30vw;width:52vw;height:52vw;max-width:640px;max-height:640px;border-radius:50%;background:var(--blue);opacity:.14}
.hero .wrap{position:relative;display:grid;gap:40px;align-items:center}@media(min-width:900px){.hero .wrap{grid-template-columns:1.1fr .9fr}}
.lead{margin:18px 0 26px;max-width:34em;color:var(--muted);font-size:1.15rem}.cta{display:flex;flex-wrap:wrap;gap:12px}
.wm{aspect-ratio:1/1;max-width:420px;width:100%;margin-inline:auto;border-radius:36px;background:var(--tint);border:2px solid var(--line);display:grid;place-content:center;text-align:center;position:relative;overflow:hidden}
.wm::before{content:"";position:absolute;right:-30%;top:-30%;width:70%;height:70%;border-radius:50%;background:var(--blue);opacity:.2}
.wm .mark{font-size:clamp(5.5rem,16vw,9rem);position:relative}.wm p{font:italic 500 1.05rem var(--serif);color:var(--maroon);padding:0 22px;position:relative}
.wm img,.heroimg{border-radius:28px;width:100%;height:auto}
section{padding:76px 0}.alt{background:var(--tint)}.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:16px;margin-bottom:30px}.head p{color:var(--muted);max-width:32em}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{padding:22px;border:2px solid var(--line);border-radius:16px;background:var(--paper);display:flex;flex-direction:column;gap:10px;align-items:flex-start}.alt .card{background:var(--paper)}
.card p{color:var(--muted);font-size:.97rem;flex:1}.card .ic{font-size:1.8rem;line-height:1}.card a.more{color:var(--blue);font-weight:600;text-underline-offset:4px}
.band{background:var(--blue);color:var(--on-blue);padding:52px 0}.band .wrap{display:flex;flex-wrap:wrap;gap:20px;justify-content:space-between;align-items:center}.band p{max-width:34em;margin-top:8px}.band .btn{background:var(--on-blue);color:var(--blue);border-color:var(--on-blue)}
ol.steps{list-style:none;padding:0;margin:0;display:grid;gap:16px;counter-reset:s;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
ol.steps li{counter-increment:s;padding:22px;border-radius:16px;background:var(--paper);border:2px solid var(--line)}ol.steps li::before{content:counter(s);display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--maroon);color:var(--paper);font:800 1.1rem var(--serif);margin-bottom:12px}ol.steps p{color:var(--muted);margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.stat{border-radius:16px;background:var(--paper);border:2px solid var(--line);padding:22px}.stat strong{display:block;font:800 2.6rem/1 var(--serif);color:var(--blue)}.stat span{color:var(--muted);font-size:.95rem}
.q{padding:22px;border-radius:16px;border:2px solid var(--line);background:var(--paper)}.q p{font:italic 500 1.1rem/1.5 var(--serif)}.q b{display:block;margin-top:12px;color:var(--maroon);font-size:.95rem}
.post{padding:22px;border-radius:16px;border:2px solid var(--line);background:var(--paper);display:flex;flex-direction:column;gap:8px}.post time{color:var(--muted);font-size:.9rem}.post p{color:var(--muted)}.post a{color:var(--blue);font-weight:600}
.pg{padding-block:44px 76px}.crumb{color:var(--muted);font-size:.95rem;margin-bottom:18px}.crumb a{color:var(--blue)}.pg h1{font-size:clamp(2rem,5vw,3.2rem)}.pg h2{font-size:1.6rem;margin:30px 0 12px}
.two{display:grid;gap:34px;margin-top:8px}@media(min-width:900px){.two{grid-template-columns:1.1fr .9fr;align-items:start}}
.pts{margin:0;padding-left:1.2rem;display:grid;gap:8px;color:var(--muted)}.pts b{color:var(--ink)}.pts.links{list-style:none;padding:0;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}.pts.links a{color:var(--blue);font-weight:500}
.quote{background:var(--tint);border:2px solid var(--line);border-radius:22px;padding:26px}.quote h2{font-size:1.5rem;margin:0 0 4px}.quote .sub2{color:var(--muted);font-size:.95rem;margin-bottom:6px}
label{display:block;font-weight:600;font-size:.92rem;margin-top:12px}input,select,textarea{display:block;width:100%;margin-top:4px;min-height:46px;padding:.65rem .9rem;border-radius:12px;border:2px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;font-weight:400}textarea{min-height:84px;resize:vertical}
.quote .btn{width:100%;margin-top:18px}.result{margin-top:14px;font-size:.95rem;display:none;padding:12px 14px;border-radius:12px;background:var(--paper);border:2px dashed var(--blue)}.result pre{white-space:pre-wrap;font:inherit;margin:6px 0 10px}
.shots{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}.shot{aspect-ratio:4/3;border-radius:14px;border:2px dashed var(--line);display:grid;place-items:center;text-align:center;padding:14px;color:var(--muted);font-size:.92rem;background-size:cover;background-position:center}.shot.has{border-style:solid}
details{border-bottom:1px solid var(--line);padding:16px 0}summary{cursor:pointer;font:600 1.1rem var(--serif);list-style:none;display:flex;justify-content:space-between;gap:16px}summary::after{content:"+";color:var(--blue);font-size:1.4rem;line-height:1}details[open] summary::after{content:"\2212"}details p{margin-top:10px;color:var(--muted);max-width:44em}
.info{list-style:none;padding:0;margin:20px 0 0;display:grid;gap:14px}.info b{display:block;font-size:.9rem;color:var(--maroon)}.info a{color:var(--blue);font-weight:600}
footer{background:#6b0f14;color:#f3e3e4;padding:44px 0 36px}footer a{color:#fff}footer h3{margin-bottom:10px;color:#fff}footer ul{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.fgrid{display:grid;gap:28px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.fbase{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;border-top:1px solid rgba(255,255,255,.25);padding-top:16px;margin-top:28px;font-size:.92rem}
.mapbox{padding:0 0 60px}
.wa{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;box-shadow:0 6px 18px rgba(0,0,0,.25)}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="topbar"><div class="wrap" id="tb"></div></div>
<header><div class="wrap bar">
  <a class="brand" href="#home" aria-label="NCS home"><span class="mark"><b>N</b><span>CS</span></span><small id="bn"></small></a>
  <button class="menu" id="menuBtn" aria-label="Open menu" aria-expanded="false" aria-controls="nav">&#9776;</button>
  <nav id="nav" aria-label="Main"><ul id="navList"></ul></nav>
</div></header>
<main id="view" tabindex="-1"></main>
<footer id="foot"></footer>
<a class="btn wa" id="callFloat" href="#contact">Call us</a>

<script>
/* ============ EDIT THIS BLOCK ONLY ============ */
const CONFIG = {
  company: "National Cleaning Service & Suppliers Pvt. Ltd.",
  short: "NCS",
  tagline: "Cleaning services and cleaning supplies for homes and businesses.",
  footerTagline: "Keep your home and office clean.",
  phones: ["+977-98XXXXXXXX"],        // first number is the main one
  whatsapp: "",                       // digits only with country code, e.g. 97798XXXXXXXX
  email: "info@yourdomain.com.np",
  address: "Kathmandu, Nepal",
  officeHours: "",                    // e.g. "Sun-Fri 9am-6pm" (hidden when empty)
  mapEmbed: "",                       // src of a Google Maps embed iframe
  heroImage: "",                      // image URL for the home page (optional)
  social: { facebook: "", instagram: "", youtube: "" },
  about: ["Replace this text with the NCS company story, registration details and years in operation."],
  mission: "", vision: "",            // shown on the About page when filled
  stats: [],                          // e.g. [{ value: "10+", label: "Years of experience" }, { value: "500+", label: "Orders" }]
  highlights: [
    { t: "Residential cleaning", d: "Home cleaning planned around your rooms and routine.", svc: "House cleaning" },
    { t: "Apartment cleaning", d: "Cleaning for apartments, from one flat to a whole block.", svc: "House cleaning" },
    { t: "Commercial cleaning", d: "Cleaning for offices, shops and other business spaces.", svc: "Janitorial services" }
  ],
  services: [  // delete any service NCS does not offer. Optional: points: ["...", "..."]
    { name: "Carpet cleaning", text: "Deep cleaning that lifts dirt, stains and allergens from carpets." },
    { name: "Sofa cleaning", text: "Gentle cleaning for sofas and upholstery, removing dust, stains and odours." },
    { name: "House cleaning", text: "Thorough home cleaning for a neat, fresh and healthy living space.",
      points: ["Regular cleaning: sweeping, dusting, vacuuming and mopping", "Deep cleaning: kitchens, bathrooms, furniture and appliances", "Move-in and move-out cleaning", "Cleaning before or after events", "Post-construction cleaning"] },
    { name: "Marble polishing", text: "Polishing that restores shine and removes light scratches from marble floors." },
    { name: "Parquet cleaning and polishing", text: "Cleaning and polishing to bring wooden parquet floors back to a glossy finish." },
    { name: "Tile cleaning", text: "Tile and grout cleaning that removes stains, mould and build-up." },
    { name: "Industrial cleaning", text: "Heavy-duty cleaning for factories, warehouses and work areas." },
    { name: "Gardening", text: "Gardening and upkeep to keep outdoor spaces green and tidy." },
    { name: "Glass cleaning", text: "Streak-free cleaning of windows and glass walls." },
    { name: "Janitorial services", text: "Daily or scheduled janitorial support for offices and commercial buildings." },
    { name: "Pest control", text: "Treatment to keep insects and rodents out of homes and workplaces." },
    { name: "House painting", text: "Interior and exterior painting for a fresh, lasting finish." },
    { name: "Chemical and cleaning supplies", text: "Cleaning chemicals, tools and consumables supplied to homes and businesses." },
    { name: "Water tank cleaning", text: "Cleaning and disinfection of water tanks for safe water storage." }
  ],
  steps: [
    { t: "Make an inquiry", d: "Contact us and tell us what needs cleaning." },
    { t: "We confirm the details", d: "We reply with a quote and a time that suits you." },
    { t: "Relax while we clean", d: "Our team completes the work and checks it with you." }
  ],
  testimonials: [],                   // real reviews only: [{ name: "", text: "" }]
  posts: [],                          // [{ title: "", date: "", excerpt: "", url: "" }]
  gallery: [],                        // [{ src: "images/job1.jpg", alt: "Office after cleaning" }]
  faqs: [
    { q: "How do I request a quote?", a: "Fill in the form on any service page or the contact page. It opens a WhatsApp message with your details, or you can call us." },
    { q: "Which areas do you serve?", a: "Mention your location in the form and we will confirm availability." },
    { q: "Do you supply cleaning products?", a: "Cleaning supplies are part of what NCS offers. List the items you need in the notes." }
  ]
};
/* ============================================== */

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const digits = s => (s || "").replace(/\D/g, "");
const tel = p => "tel:" + p.replace(/[^+\d]/g, "");
const slug = s => "service-" + s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const waReady = () => digits(CONFIG.whatsapp).length >= 10;
const S = CONFIG.services.map(s => ({ ...s, id: slug(s.name) }));
const P0 = CONFIG.phones[0];
function iconFor(n) {
  n = n.toLowerCase();
  const m = [["carpet","\u{1F9F6}"],["sofa","\u{1F6CB}\uFE0F"],["house cl","\u{1F3E0}"],["marble","\u2728"],["parquet","\u{1FAB5}"],["tile","\u{1F9F1}"],["industrial","\u{1F3ED}"],["garden","\u{1F33F}"],["glass","\u{1FA9F}"],["janitor","\u{1F9F9}"],["pest","\u{1F41C}"],["paint","\u{1F3A8}"],["suppl","\u{1F9F4}"],["tank","\u{1F4A7}"]].find(x => n.includes(x[0]));
  return m ? m[1] : "\u2728";
}
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

/* shared pieces */
function form(title, sub, sel, contact) {
  return `<form class="quote apptform" novalidate><h2>${esc(title)}</h2><p class="sub2">${esc(sub)}</p>
  <label>Name<input name="Name" autocomplete="name" required></label>
  <label>Phone<input name="Phone" type="tel" autocomplete="tel" required></label>
  <label>Email<input name="Email" type="email" autocomplete="email"></label>
  ${contact ? `<label>Subject<input name="Subject"></label>` : `<label>Preferred date<input name="Date" type="date"></label>
  <label>Service<select name="Service">${S.map(s => `<option${s.name === sel ? " selected" : ""}>${esc(s.name)}</option>`).join("")}</select></label>`}
  <label>Notes<textarea name="Notes" placeholder="Location, size of the space, anything we should know"></textarea></label>
  <button class="btn" type="submit">Send request</button><div class="result" role="status"></div></form>`;
}
const stats = () => CONFIG.stats.length ? `<section class="alt"><div class="wrap stats">${CONFIG.stats.map(s => `<div class="stat"><strong>${esc(s.value)}</strong><span>${esc(s.label)}</span></div>`).join("")}</div></section>` : "";
const cta = () => `<section class="band"><div class="wrap"><div><h2>Let us handle the mess</h2><p>Book your cleaning service now and enjoy a cleaner space without lifting a finger.</p></div><a class="btn" href="${tel(P0)}">Call ${esc(P0)}</a></div></section>`;
const reviews = () => CONFIG.testimonials.length ? `<section><div class="wrap"><div class="head"><h2>What our customers say</h2></div><div class="grid">${CONFIG.testimonials.map(t => `<div class="q"><p>\u201c${esc(t.text)}\u201d</p><b>${esc(t.name)}</b></div>`).join("")}</div></div></section>` : "";
const postCards = () => CONFIG.posts.map(p => `<article class="post"><time>${esc(p.date)}</time><h3>${esc(p.title)}</h3><p>${esc(p.excerpt)}</p><a href="${esc(p.url || "#blog")}">Read more</a></article>`).join("");
const blogSec = () => CONFIG.posts.length ? `<section class="alt"><div class="wrap"><div class="head"><h2>Latest news and articles</h2><a class="btn ghost" href="#blog">All articles</a></div><div class="grid">${postCards()}</div></div></section>` : "";
const faqBlock = () => `<h2>Frequently asked questions</h2>${CONFIG.faqs.map(f => `<details><summary>${esc(f.q)}</summary><p>${esc(f.a)}</p></details>`).join("")}`;
const svcCards = list => list.map(s => `<article class="card"><span class="ic" aria-hidden="true">${iconFor(s.name)}</span><h3>${esc(cap(s.name))}</h3><p>${esc(s.text)}</p><a class="more" href="#${s.id}">Learn more</a></article>`).join("");

/* views */
const views = {
  home: () => `<div class="hero"><div class="wrap"><div><h1>Cleaning services in Kathmandu, Nepal</h1><p class="lead">${esc(CONFIG.tagline)}</p>
    <div class="cta"><a class="btn" href="#contact">Request a quote</a><a class="btn ghost" href="${tel(P0)}">Call ${esc(P0)}</a></div></div>
    ${CONFIG.heroImage ? `<img class="heroimg" src="${esc(CONFIG.heroImage)}" alt="Cleaning team at work">` : `<div class="wm" aria-hidden="true"><div class="mark"><b>N</b><span>CS</span></div><p>${esc(CONFIG.company)}</p></div>`}</div></div>
  <section class="alt"><div class="wrap"><div class="head"><h2>Who we are</h2><p>${esc(CONFIG.about[0])}</p></div>
    <div class="grid">${CONFIG.highlights.map(h => { const s = S.find(x => x.name === h.svc); return `<div class="card"><h3>${esc(h.t)}</h3><p>${esc(h.d)}</p><a class="btn ghost" href="#${s ? s.id : "contact"}">Get a quote</a></div>`; }).join("")}</div></div></section>
  <section><div class="wrap"><div class="head"><h2>Our cleaning services</h2><a class="btn ghost" href="#services">All services</a></div><div class="grid">${svcCards(S)}</div></div></section>
  ${cta()}
  <section><div class="wrap"><div class="head"><h2>How to work with us</h2></div><ol class="steps">${CONFIG.steps.map(s => `<li><h3>${esc(s.t)}</h3><p>${esc(s.d)}</p></li>`).join("")}</ol></div></section>
  ${stats()}${reviews()}${blogSec()}
  <section class="alt"><div class="wrap two"><div><h2>Book a cleaning service</h2><p class="lead">Send us the details and we will reply with a quote.</p></div>${form("Request a quote", "We reply on WhatsApp or by phone.", "", false)}</div></section>`,
  about: () => `<div class="wrap pg"><p class="crumb"><a href="#home">Home</a> / About us</p><h1>About ${esc(CONFIG.short)}</h1>
    <div style="height:18px"></div><div style="max-width:44em;display:grid;gap:14px;color:var(--muted)">${CONFIG.about.map(p => `<p>${esc(p)}</p>`).join("")}</div>
    ${CONFIG.mission || CONFIG.vision ? `<div class="grid" style="margin-top:34px">${CONFIG.mission ? `<div class="card"><h3>Our mission</h3><p>${esc(CONFIG.mission)}</p></div>` : ""}${CONFIG.vision ? `<div class="card"><h3>Our vision</h3><p>${esc(CONFIG.vision)}</p></div>` : ""}</div>` : ""}</div>${stats()}${cta()}`,
  services: () => `<div class="wrap pg"><p class="crumb"><a href="#home">Home</a> / Services</p><h1>Our cleaning services</h1><p class="lead">Choose a service to see details and request a quote.</p><div class="grid">${svcCards(S)}</div></div>${cta()}`,
  gallery: () => `<div class="wrap pg"><p class="crumb"><a href="#home">Home</a> / Gallery</p><h1>Our work</h1><div style="height:24px"></div><div class="shots">${CONFIG.gallery.length ? CONFIG.gallery.map(g => `<div class="shot has" role="img" aria-label="${esc(g.alt || "Completed cleaning job")}" style="background-image:url('${esc(g.src)}')"></div>`).join("") : [1, 2, 3, 4, 5, 6].map(() => `<div class="shot">Photo placeholder<br>Add your own job photos</div>`).join("")}</div></div>`,
  blog: () => `<div class="wrap pg"><p class="crumb"><a href="#home">Home</a> / Blog</p><h1>Latest news and articles</h1><div style="height:24px"></div>${CONFIG.posts.length ? `<div class="grid">${postCards()}</div>` : `<p class="lead">Articles will appear here soon.</p>`}</div>`,
  faq: () => `<div class="wrap pg"><p class="crumb"><a href="#home">Home</a> / FAQ</p><h1>Questions, answered</h1>${faqBlock().replace(/<h2>.*?<\/h2>/, "")}</div>`,
  contact: () => {
    const items = [["Address", esc(CONFIG.address)], ["Phone", CONFIG.phones.map(p => `<a href="${tel(p)}">${esc(p)}</a>`).join("<br>")], ["Email", `<a href="mailto:${esc(CONFIG.email)}">${esc(CONFIG.email)}</a>`],
      waReady() && ["WhatsApp", `<a href="https://wa.me/${digits(CONFIG.whatsapp)}" rel="noopener">Message us</a>`], CONFIG.officeHours && ["Office hours", esc(CONFIG.officeHours)],
      ...Object.entries(CONFIG.social).filter(e => e[1]).map(e => [cap(e[0]), `<a href="${esc(e[1])}" rel="noopener">Follow ${esc(CONFIG.short)}</a>`])].filter(Boolean);
    return `<div class="wrap pg"><p class="crumb"><a href="#home">Home</a> / Contact us</p><h1>Get in touch</h1><div class="two" style="margin-top:20px"><div><p class="lead">Have a question or need a quote? Reach out and we will get back to you.</p>
    <ul class="info">${items.map(i => `<li><b>${i[0]}</b>${i[1]}</li>`).join("")}</ul></div>${form("Send us a message", "We will reply as soon as we can.", "", true)}</div></div>`;
  }
};
function vService(s) {
  return `<div class="wrap pg"><p class="crumb"><a href="#home">Home</a> / <a href="#services">Services</a> / ${esc(cap(s.name))}</p>
  <div class="two"><article><h1>${esc(cap(s.name))} in Kathmandu</h1><p class="lead">${esc(s.text)}</p>
  ${s.points && s.points.length ? `<h2>What this includes</h2><ul class="pts">${s.points.map(p => `<li>${esc(p)}</li>`).join("")}</ul>` : ""}
  <h2>Other services</h2><ul class="pts links">${S.filter(x => x !== s).map(x => `<li><a href="#${x.id}">${esc(cap(x.name))}</a></li>`).join("")}</ul>
  ${faqBlock()}</article><aside>${form("Get an appointment", "Pick a date and we will confirm by phone.", s.name, false)}</aside></div></div>`;
}

$("#navList").innerHTML = `<li><a href="#home" data-v="home">Home</a></li><li><a href="#about" data-v="about">About us</a></li>

  ${CONFIG.mapEmbed ? `<iframe title="Map" src="${esc(CONFIG.mapEmbed)}" loading="lazy" style="width:100%;height:280px;border:0;border-radius:16px;margin-top:28px"></iframe>` : ""}
  <div class="fbase"><span>\u00a9 ${new Date().getFullYear()} ${esc(CONFIG.company)}</span><a href="#home">Back to top</a></div></div>`;

/* router */
function animate() {
  if (!("IntersectionObserver" in window) || matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  const io = new IntersectionObserver(es => es.forEach(en => {
    if (!en.isIntersecting) return; io.unobserve(en.target);
    const m = en.target.textContent.match(/^(\D*)(\d+)(.*)$/); if (!m) return;
    const end = +m[2]; let t0; const step = ts => { t0 = t0 || ts; const p = Math.min((ts - t0) / 1200, 1); en.target.textContent = m[1] + Math.round(end * p) + m[3]; if (p < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  }));
  document.querySelectorAll(".stat strong").forEach(el => io.observe(el));
}
function route() {
  const id = location.hash.slice(1) || "home", svc = S.find(s => s.id === id);
  const name = svc ? cap(svc.name) : id === "home" || !views[id] ? "" : cap(id === "faq" ? "FAQ" : id);
  $("#view").innerHTML = svc ? vService(svc) : (views[id] || views.home)();
  document.title = (name ? name + " | " : "") + CONFIG.company;
  window.scrollTo(0, 0);
  document.querySelectorAll("#navList a[data-v]").forEach(a => { const on = a.dataset.v === (svc ? "services" : views[id] ? id : "home"); on ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"); });
  $("#nav").classList.remove("open"); $("#menuBtn").setAttribute("aria-expanded", "false");
  animate();
}
addEventListener("hashchange", route); route();

/* forms: WhatsApp when a number is set, otherwise a copyable message */
document.addEventListener("submit", e => {
  const f = e.target; if (!f.classList.contains("apptform")) return; e.preventDefault();
  const out = f.querySelector(".result"); out.style.display = "block";
  const d = new FormData(f);
  if (!String(d.get("Name")).trim() || !String(d.get("Phone")).trim()) { out.textContent = "Enter your name and phone number so we can reply."; return; }
  const msg = "Hello " + CONFIG.short + ", I would like a quote.\n" + [...d].filter(x => String(x[1]).trim()).map(x => x[0] + ": " + String(x[1]).trim()).join("\n");
  if (waReady()) { out.textContent = "Opening WhatsApp with your request."; window.open("https://wa.me/" + digits(CONFIG.whatsapp) + "?text=" + encodeURIComponent(msg), "_blank", "noopener"); }
  else {
    out.innerHTML = "<b>Request ready.</b> Copy it and send it to us by phone or email.<pre></pre><button class='btn ghost' type='button'>Copy request</button>";
    out.querySelector("pre").textContent = msg;
    out.querySelector("button").onclick = ev => { navigator.clipboard && navigator.clipboard.writeText(msg).then(() => ev.target.textContent = "Copied"); };
  }
});
$("#menuBtn").addEventListener("click", () => { const o = $("#nav").classList.toggle("open"); $("#menuBtn").setAttribute("aria-expanded", o); });
</script>
